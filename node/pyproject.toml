[project]
name = "yt-digest-node"
version = "0.1.0"
description = "yt-digest node: transcript pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.1",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.85.0",
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_digest_node"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true
